<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Massachusetts Historical Border Map (1620–1920)</title>
  
  <!-- MapLibre GL JS CSS -->
  <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app-container">
    
    <!-- MAP CONTAINER -->
    <div id="map-container">
      <div id="map"></div>
      
      <!-- Top-Left Map Controls Bar -->
      <div id="map-controls-bar">
        <button id="state-select-btn" class="map-ctrl-btn">
          <span>MA</span>
          <span class="dropdown-arrow">▼</span>
        </button>
        <!-- MAP LOCK VIEW BUTTON -->
        <button id="lock-view-btn" class="map-ctrl-btn locked" data-tooltip="Toggle Locked View" data-tooltip-pos="bottom">
          <svg id="lock-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
          <span id="lock-text">Locked</span>
        </button>
      </div>
    </div>

    <!-- SIDEBAR PANEL -->
    <aside id="sidebar">
      
      <!-- TOP SECTION: Timeline Panel -->
      <section id="timeline-section" class="sidebar-panel">
        <!-- Minimized Stripe Bar -->
        <div class="stripe-bar">
          <span class="stripe-title">Timeline</span>
          <button class="panel-btn default-btn" data-tooltip="Default View" data-tooltip-pos="bottom">
            <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><rect width="12" height="12" x="2" y="2" rx="1"/></svg>
          </button>
        </div>

        <div class="panel-full-content">
          <div class="title-row">
            <h2>Timeline</h2>
          </div>
          <div class="controls-row">
            <div class="controls-left">
              <span class="subtitle">1620 – 1920 Event Chronology</span>
            </div>
            <div class="controls-right">
              <button class="panel-btn default-btn" data-tooltip="Default View" data-tooltip-pos="bottom">
                <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><rect width="12" height="12" x="2" y="2" rx="1"/></svg>
              </button>
              <button class="panel-btn minimize-btn" data-tooltip="Minimize" data-tooltip-pos="bottom">
                <svg width="12" height="2" viewBox="0 0 12 2" fill="currentColor"><rect width="12" height="2" rx="1"/></svg>
              </button>
            </div>
          </div>

          <!-- Timeline Events List -->
          <div id="timeline-events" class="panel-body">
            
            <!-- 1620 Event -->
            <div class="event-card" data-year="1620" data-town-id="plymouth">
              <div class="event-header">
                <span class="event-year">1620</span>
                <span class="event-title">Plymouth Colony</span>
              </div>
              <p class="event-desc">Mayflower lands; Plymouth established.</p>
              <button class="jump-year-btn hidden" data-tooltip="Go">
                <svg width="10" height="10" viewBox="0 0 12 12" fill="currentColor">
                  <path d="M2 1l8 5-8 5V1z"/>
                </svg>
              </button>
            </div>

            <!-- 1630 Event -->
            <div class="event-card" data-year="1630" data-town-id="boston">
              <div class="event-header">
                <span class="event-year">1630</span>
                <span class="event-title">Boston Incorporated</span>
              </div>
              <p class="event-desc">
                Boston settled under 
                <a href="#" class="library-link" data-card-id="john-winthrop">John Winthrop</a>.
              </p>
              <button class="jump-year-btn hidden" data-tooltip="Go">
                <svg width="10" height="10" viewBox="0 0 12 12" fill="currentColor">
                  <path d="M2 1l8 5-8 5V1z"/>
                </svg>
              </button>
            </div>

            <!-- 1636 Event -->
            <div class="event-card" data-year="1636" data-town-id="dedham">
              <div class="event-header">
                <span class="event-year">1636</span>
                <span class="event-title">Dedham Plantation Grant</span>
              </div>
              <p class="event-desc">
                <a href="#" class="library-link" data-card-id="dedham-grant">Dedham incorporated</a> from inland plantation grant.
              </p>
              <button class="jump-year-btn hidden" data-tooltip="Go">
                <svg width="10" height="10" viewBox="0 0 12 12" fill="currentColor">
                  <path d="M2 1l8 5-8 5V1z"/>
                </svg>
              </button>
            </div>

          </div>
        </div>
      </section>

      <!-- RESIZER BOUNDARY -->
      <div id="panel-resizer" title="Drag up or down to resize panels"></div>

      <!-- BOTTOM SECTION: Library Panel -->
      <section id="library-section" class="sidebar-panel">
        <!-- Minimized Stripe Bar -->
        <div class="stripe-bar">
          <span class="stripe-title">Library</span>
          <button class="panel-btn default-btn" data-tooltip="Default View" data-tooltip-pos="bottom">
            <svg width="14" height="10" viewBox="0 0 16 12" fill="none" stroke="currentColor" stroke-width="2"><rect width="14" height="10" x="1" y="1" rx="1"/></svg>
          </button>
        </div>

        <div class="panel-full-content">
          <div class="title-row">
            <h2>Library</h2>
          </div>
          <div class="controls-row">
            <div class="controls-left">
              <button id="lib-back" class="nav-btn" disabled data-tooltip="Back">&larr;</button>
              <button id="lib-forward" class="nav-btn" disabled data-tooltip="Forward">&rarr;</button>
            </div>
            <div class="controls-right">
              <button class="panel-btn default-btn" data-tooltip="Default View" data-tooltip-pos="bottom">
                <svg width="14" height="10" viewBox="0 0 16 12" fill="none" stroke="currentColor" stroke-width="2"><rect width="14" height="10" x="1" y="1" rx="1"/></svg>
              </button>
              <button class="panel-btn minimize-btn" data-tooltip="Minimize" data-tooltip-pos="bottom">
                <svg width="12" height="2" viewBox="0 0 12 2" fill="currentColor"><rect width="12" height="2" rx="1"/></svg>
              </button>
            </div>
          </div>

          <div id="library-content" class="panel-body"></div>

          <div id="library-path-row" class="path-row">
            <span id="library-path-text" class="path-text">Home</span>
            <button id="toggle-path-btn" class="path-toggle-btn" data-tooltip="Toggle File Path">
              <svg id="path-toggle-icon" width="12" height="12" viewBox="0 0 16 16" fill="currentColor">
                <rect x="2" y="2" width="12" height="12" fill="currentColor"/>
              </svg>
            </button>
          </div>
        </div>
      </section>

    </aside>

    <!-- Bottom Slider Controls -->
    <div id="slider-controls">
      <button id="play-btn">Play</button>
      <div class="slider-wrapper">
        
        <!-- Blue Downward Triangle Indicator above Slider Track -->
        <div id="slider-marker" class="slider-marker hidden" data-tooltip="Go">
          <svg width="12" height="10" viewBox="0 0 12 10" fill="#0d6efd">
            <path d="M0 0l6 10 6-10H0z"/>
          </svg>
        </div>

        <label for="year-slider">Year: <strong id="year-display">1620</strong></label>
        <input type="range" id="year-slider" min="1620" max="1920" value="1620" step="1">
      </div>
    </div>
  </div>

  <!-- MapLibre GL JS Script -->
  <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
  <script src="app.js"></script>
</body>
</html>
