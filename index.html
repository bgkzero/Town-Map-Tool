<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Massachusetts Historical Border Map (1620–2020)</title>
  
  <!-- MapLibre GL JS CSS -->
  <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app-container">
    
    <!-- ==========================================
         MAIN VIEW (LEFT 2/3)
         ========================================== -->
    <main id="main-view">
      
      <!-- MAP CONTAINER -->
      <div id="map-container">
        <div id="map"></div>
        
        <!-- Top-Left Map Controls Bar -->
        <div id="map-controls-bar">
          <button id="state-select-btn" class="map-ctrl-btn" data-tooltip="Functionality TBD" data-tooltip-pos="bottom-edge">
            <span>MA</span>
            <span class="dropdown-arrow">▼</span>
          </button>
          <button id="lock-view-btn" class="map-ctrl-btn locked" data-tooltip="Toggle Locked View" data-tooltip-pos="bottom">
            <svg id="lock-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            <span id="lock-text">Locked</span>
          </button>
        </div>
      </div>

      <!-- SLIDER PANEL (BOTTOM OF MAIN VIEW) -->
      <section id="slider-panel">
        
        <!-- ROW 1: SLIDER CONTAINER -->
        <div id="slider-container">
          <!-- "Here" Indicator Scalene Triangle -->
          <div id="here-indicator" class="here-indicator gray" title="Here Indicator">
            <svg width="14" height="14" viewBox="0 0 16 16">
              <polygon points="2,0 14,0 5,16" fill="currentColor"/>
            </svg>
          </div>

          <!-- Horizontal Timeline Scroll Viewport -->
          <div id="timeline-viewport">
            <div id="timeline-track">
              <div id="timeline-line"></div>
              <div id="ticks-container"></div>
              <div id="circles-container"></div>
              <!-- Timeline Handle -->
              <div id="timeline-handle" class="timeline-handle"></div>
            </div>
          </div>

          <!-- Year Titles Row -->
          <div id="year-titles-row"></div>
          
          <!-- Circle Hover Tooltip Space -->
          <div id="circle-tooltip-bar"></div>
        </div>

        <!-- ROW 2: CONTROLS ROW -->
        <div id="controls-row">
          
          <!-- LEFT: ZOOM CONTROLS -->
          <div class="controls-group zoom-controls">
            <button id="zoom-out-btn" class="ctrl-btn" data-tooltip="Zoom Out">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                <line x1="8" y1="11" x2="14" y2="11"></line>
              </svg>
            </button>
            
            <div id="zoom-container">
              <input type="range" id="zoom-slider" min="0" max="2" value="0" step="1">
              <span id="zoom-level-title" class="zoom-title">CENTURY</span>
            </div>

            <button id="zoom-in-btn" class="ctrl-btn" data-tooltip="Zoom In">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                <line x1="11" y1="8" x2="11" y2="14"></line>
                <line x1="8" y1="11" x2="14" y2="11"></line>
              </svg>
            </button>
          </div>

          <!-- MIDDLE: STEPPER CONTROLS -->
          <div class="controls-group stepper-controls">
            <button id="prev-year-btn" class="ctrl-btn" data-tooltip="Previous Year">◄◄</button>
            <button id="prev-event-btn" class="ctrl-btn" data-tooltip="Previous Event">◄</button>
            <button id="play-pause-btn" class="ctrl-btn play-btn" data-tooltip="Play/Pause">
              <span id="play-icon">▶</span>
              <span id="play-text">Play</span>
            </button>
            <button id="next-event-btn" class="ctrl-btn" data-tooltip="Next Event">►</button>
            <button id="next-year-btn" class="ctrl-btn" data-tooltip="Next Year">►►</button>
          </div>

          <!-- RIGHT: SHOWING CONTROLS -->
          <div class="controls-group showing-controls">
            <!-- Handle Icon -->
            <div class="handle-icon-indicator" title="Current Handle Position">│</div>

            <!-- Showing Bar -->
            <div class="showing-bar">
              <input type="text" id="year-field" value="1620" maxlength="4" placeholder="YYYY" />
              <span id="events-amount" class="events-amount">(1 event)</span>
            </div>

            <!-- Link Button -->
            <button id="link-btn" class="ctrl-btn link-btn unlinked" data-tooltip="Toggle Link">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
                <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
              </svg>
            </button>

            <!-- Linked Indicator -->
            <div id="linked-indicator" class="linked-indicator gray" title="Linked Indicator">
              <svg width="12" height="12" viewBox="0 0 16 16">
                <polygon points="2,0 14,0 5,16" fill="currentColor"/>
              </svg>
            </div>
          </div>

        </div>

        <!-- Showing Status Text Row -->
        <div id="showing-status-row">
          <span id="showing-status-text"></span>
        </div>
      </section>

    </main>

    <!-- ==========================================
         SIDE PANEL (RIGHT 1/3)
         ========================================== -->
    <aside id="sidebar">
      
      <!-- TOP SECTION: TIMELINE PANEL -->
      <section id="timeline-section" class="sidebar-panel">
        <!-- Minimized Stripe Bar -->
        <div class="stripe-bar">
          <span class="stripe-title">TIMELINE</span>
          <button class="panel-btn default-btn" data-tooltip="Default View" data-tooltip-pos="bottom-edge">
            <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><rect width="12" height="12" x="2" y="2" rx="1"/></svg>
          </button>
        </div>

        <div class="panel-full-content">
          <!-- Timeline Header -->
          <div class="panel-header">
            <h2 class="panel-title">TIMELINE</h2>
            <div class="header-buttons">
              <button class="panel-btn default-btn" data-tooltip="Default View" data-tooltip-pos="bottom">
                <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><rect width="12" height="12" x="2" y="2" rx="1"/></svg>
              </button>
              <button class="panel-btn minimize-btn" data-tooltip="Minimize" data-tooltip-pos="bottom-edge">
                <svg width="12" height="2" viewBox="0 0 12 2" fill="currentColor"><rect width="12" height="2" rx="1"/></svg>
              </button>
            </div>
          </div>

          <!-- Timeline Body (Vertical Line & Event Cards) -->
          <div id="timeline-body" class="panel-body">
            <div id="vertical-timeline-track">
              <div id="vertical-line"></div>
              <div id="event-cards-list">
                <!-- Dynamically generated event cards -->
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- MOVABLE BOUNDARY RESIZER -->
      <div id="panel-resizer" title="Drag to resize panels"></div>

      <!-- BOTTOM SECTION: LIBRARY PANEL -->
      <section id="library-section" class="sidebar-panel">
        <!-- Minimized Stripe Bar -->
        <div class="stripe-bar">
          <span class="stripe-title">LIBRARY</span>
          <button class="panel-btn default-btn" data-tooltip="Default View" data-tooltip-pos="bottom-edge">
            <svg width="14" height="10" viewBox="0 0 16 12" fill="none" stroke="currentColor" stroke-width="2"><rect width="14" height="10" x="1" y="1" rx="1"/></svg>
          </button>
        </div>

        <div class="panel-full-content">
          <!-- Library Header -->
          <div class="panel-header">
            <h2 class="panel-title">LIBRARY</h2>
            <div class="header-buttons">
              <button id="lib-back" class="nav-btn" disabled data-tooltip="Back" data-tooltip-pos="bottom">&lt;</button>
              <button id="lib-forward" class="nav-btn" disabled data-tooltip="Forward" data-tooltip-pos="bottom">&gt;</button>
              <button class="panel-btn default-btn" data-tooltip="Default View" data-tooltip-pos="bottom">
                <svg width="14" height="10" viewBox="0 0 16 12" fill="none" stroke="currentColor" stroke-width="2"><rect width="14" height="10" x="1" y="1" rx="1"/></svg>
              </button>
              <button class="panel-btn minimize-btn" data-tooltip="Minimize" data-tooltip-pos="bottom-edge">
                <svg width="12" height="2" viewBox="0 0 12 2" fill="currentColor"><rect width="12" height="2" rx="1"/></svg>
              </button>
            </div>
          </div>

          <!-- Library Main Body -->
          <div id="library-content" class="panel-body"></div>

          <!-- Path Bar -->
          <div id="library-path-row" class="path-bar">
            <span id="library-path-text" class="path-text">Home</span>
            <button id="toggle-path-btn" class="path-toggle-btn" data-tooltip="File Path" data-tooltip-pos="bottom-edge">
              <svg id="path-toggle-icon" width="12" height="12" viewBox="0 0 16 16" fill="currentColor">
                <rect x="2" y="2" width="12" height="12" fill="currentColor"/>
              </svg>
            </button>
          </div>
        </div>
      </section>

    </aside>

  </div>

  <!-- MapLibre GL JS Script -->
  <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
  <script src="app.js"></script>
</body>
</html>
